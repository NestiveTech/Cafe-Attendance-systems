{% extends 'attendance/base.html' %}
{% block content %}
    <h1>Employees</h1>
    <div class="card">
        <h3>Add Staff (Set Late Time)</h3>
        <form method="POST" style="display:grid; grid-template-columns:0.5fr 1fr 1fr 1fr 0.8fr auto; gap:10px; align-items:end;">
            {% csrf_token %}
            <div><label>ID</label><input name="emp_id" placeholder="001" required></div>
            <div><label>Name</label><input name="name" required></div>
            <div><label>Role</label><input name="role" required></div>
            <div><label>Joined</label><input type="date" name="joined_date" required></div>
            <div><label style="color:#B8513C;">Late Time</label><input type="time" name="threshold_time" value="10:00" required></div>
            <button>Add</button>
        </form>
    </div>
    <table>
        <tr><th>ID</th><th>Name</th><th>Role</th><th>Late Time</th><th>Joined</th></tr>
        {% for e in employees %}
        <tr><td>{{ e.ID }}</td><td>{{ e.Name }}</td><td>{{ e.Role }}</td><td>{{ e.Late_Threshold }}</td><td>{{ e.Joined_Date }}</td></tr>
        {% endfor %}
    </table>
{% endblock %}
