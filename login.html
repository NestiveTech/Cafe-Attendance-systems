<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CafeTerrain | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Styles: simple, adjust as you like -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-wrapper {
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    .login-header p {
      font-size: 13px;
      color: #6b7280;
    }
    .login-header span.logo {
      font-size: 32px;
      display: inline-block;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #374151;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #2563eb;
    }
    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: #4b5563;
    }
    .remember-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 0;
      cursor: pointer;
    }
    .remember-row a {
      color: #2563eb;
      text-decoration: none;
      font-size: 12px;
    }
    .remember-row a:hover {
      text-decoration: underline;
    }
    button[type="submit"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button[type="submit"]:hover {
      background: #1d4ed8;
    }
    .footer-text {
      text-align: center;
      margin-top: 16px;
      font-size: 12px;
      color: #6b7280;
    }

    /* Toast notification styles (used by common.js) */
    .toast-notification {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #111827;
      color: #f9fafb;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 9999;
    }
    .toast-notification.show {
      opacity: 1;
      transform: translateY(0);
    }
    .toast-notification .toast-message {
      margin-right: 8px;
    }
    .toast-notification .toast-close {
      background: transparent;
      border: none;
      color: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .toast-success { background: #047857; }
    .toast-error { background: #b91c1c; }
    .toast-info { background: #1d4ed8; }

    /* Global loader (used by common.js) */
    .global-loader {
      position: fixed;
      inset: 0;
      background: rgba(15,23,42,0.25);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
    }
    .loader-content {
      background: #ffffff;
      padding: 14px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      font-size: 13px;
      color: #374151;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Global loader injected/used by common.js -->
  <div id="globalLoader" class="global-loader" style="display:none;">
    <div class="loader-content">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="login-header">
      <span class="logo">🌳</span>
      <h1>CafeTerrain Attendance</h1>
      <p>Please sign in to continue</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="remember-row">
        <label>
          <input type="checkbox" id="rememberMe" />
          <span>Remember me</span>
        </label>
        <!-- optional forgot link -->
        <a href="#" onclick="showInfo('Contact admin to reset password'); return false;">
          Forgot password?
        </a>
      </div>

      <button type="submit">Login</button>
    </form>

    <p class="footer-text">
      © CafeTerrain Attendance System
    </p>
  </div>

  <!-- Scripts order: config -> common -> auth -->
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

  <script>
    // On page load, optionally auto-fill remembered email (auth.js already does this, but this is safe)
    document.addEventListener('DOMContentLoaded', () => {
      const remembered = getRememberedEmail && getRememberedEmail();
      const emailInput = document.getElementById('email');
      if (remembered && emailInput) {
        emailInput.value = remembered;
      }
    });

    // Handle login submit
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('rememberMe').checked;

      const res = await login(email, password);

      if (res && res.success) {
        if (typeof rememberUser === 'function') {
          rememberUser(email, remember);
        }
        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
